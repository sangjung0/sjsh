name: ${CONTAINER_NAME}
services:
  service:
    user: "${CONTAINER_UID}:${CONTAINER_UID}"
    shm_size: ${CONTAINER_SHM_SIZE}
    container_name: ${CONTAINER_NAME}_service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONTAINER_USER: ${CONTAINER_USER}
        CONTAINER_UID: ${CONTAINER_UID}
    env_file:
      - ./.env
      - ../.env
    volumes:
      - ../:${CONTAINER_WORK_DIR}

      # agents
      - agents:${CONTAINER_WORK_DIR}/.agents:ro
      - agent_workspace:${CONTAINER_WORK_DIR}/.agent-workspace:rw

    command: ["tail", "-f", "/dev/null"]

volumes:
  agent_workspace:
    driver: local
  agents:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${AGENTS_PATH}
